packages:
  - .

allowBuilds:
  # The workers test harness pulls esbuild in directly (via
  # @cloudflare/vitest-pool-workers); its postinstall validates the
  # platform binary.
  esbuild: true
  # alchemy's local dev runtime (workerd) and its state serializer need
  # postinstall scripts; both are transitive deps of alchemy.
  msgpackr-extract: true
  workerd: true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vitest: 4.1.9
  vite-plus: 0.2.8

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"

# This workspace has no package versions excluded from release-age checks.
minimumReleaseAgeExclude: []
