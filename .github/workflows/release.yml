name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The changesets action overrides user-level npm config with its own
      # generated .npmrc, so put a literal (CI-only) token in the project
      # .npmrc, which both npm and pnpm always honor.
      - name: Configure GitHub Packages auth
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: changesets/action@v1
        with:
          publish: pnpm run release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The changesets action silently skips the tag push and the GitHub
      # release (its --follow-tags push misses changesets v3's lightweight
      # tags) — this step finishes the release the repo's way (#77), and
      # no-ops when the tag and release already exist.
      - name: Tag and release the published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tagged-release.mjs
