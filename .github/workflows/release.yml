name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Pushes and PRs made with GITHUB_TOKEN start no workflows, so CI never
      # ran on the "Version Packages" PR and the required `CI / validate`
      # check blocked its merge. A GitHub App installation token does start
      # them. Set the RELEASE_APP_ID variable and the
      # RELEASE_APP_PRIVATE_KEY secret to turn it on; until then the job
      # falls back to GITHUB_TOKEN and the PR needs a close-and-reopen to
      # start CI.
      - name: Mint the release app token
        id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The changesets action pushes the release branch with these
          # credentials, so they decide whether that push starts CI too.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # The changesets action overrides user-level npm config with its own
      # generated .npmrc, so put a literal (CI-only) token in the project
      # .npmrc, which both npm and pnpm always honor. The publish registry
      # follows the NPM_TOKEN secret: npmjs.com when it is set (public
      # installs need no GitHub auth), GitHub Packages otherwise.
      - name: Configure publish registry
        env:
          NPMJS_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$NPMJS_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPMJS_TOKEN" >> .npmrc
            echo "NPM_TOKEN=$NPMJS_TOKEN" >> "$GITHUB_ENV"
          else
            echo "@quick-release:registry=https://npm.pkg.github.com" >> .npmrc
            echo "//npm.pkg.github.com/:_authToken=$GH_PACKAGES_TOKEN" >> .npmrc
            echo "NPM_TOKEN=$GH_PACKAGES_TOKEN" >> "$GITHUB_ENV"
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: changesets/action@v1
        with:
          publish: pnpm run release-publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ env.NPM_TOKEN }}
      # The changesets action silently skips the tag push and the GitHub
      # release (its --follow-tags push misses changesets v3's lightweight
      # tags) — this step finishes the release the repo's way (#77), and
      # no-ops when the tag and release already exist.
      - name: Tag and release the published version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/commands/tagged-release.mjs
